<style>
:root{--bg:#FFFFFF;--ink:#141A16;--dim:#4A524D;--linje:#E4E2DC;--gron:#4E7A45;--fel:#B4442E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px}
form{width:min(380px,100%);display:grid;gap:14px}
h1{font:600 32px/1.15 Newsreader,Georgia,serif;margin:12px 0 0}
p{margin:0;color:var(--dim)}
label{font-weight:500;font-size:14px}
input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--linje);font:inherit;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--gron);outline-offset:2px}
.rad{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--dim)}
button{padding:12px 20px;border:0;background:var(--gron);color:#FFFFFF;font:inherit;font-weight:500;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#fel{color:var(--fel);min-height:1.5em;font-size:14px}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const PKCS8 = [0x30,0x2e,0x02,0x01,0x00,0x30,0x05,0x06,0x03,0x2b,0x65,0x6e,0x04,0x22,0x04,0x20];
const MINNE = "nordwik-detaljplaner-nyckel";

async function nyckelUrLosen(pw){
  const bas = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(PAKET.salt), iterations:PAKET.iter}, bas, 256));
}
async function oppna(d){
  const priv = await crypto.subtle.importKey("pkcs8", new Uint8Array([...PKCS8, ...d]), {name:"X25519"}, false, ["deriveBits"]);
  const epub = await crypto.subtle.importKey("raw", b64(PAKET.epub), {name:"X25519"}, false, []);
  const delad = await crypto.subtle.deriveBits({name:"X25519", public:epub}, priv, 256);
  const hk = await crypto.subtle.importKey("raw", delad, "HKDF", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt:new Uint8Array(), info:new TextEncoder().encode("nordwik-detaljplaner")}, hk, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAKET.iv)}, k, b64(PAKET.ct));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
(async () => {
  try{ const m = localStorage.getItem(MINNE); if(m){ await oppna(b64(m)); return; } }catch(e){ try{ localStorage.removeItem(MINNE); }catch(_){} }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const knapp = document.getElementById("knapp"), fel = document.getElementById("fel");
  knapp.disabled = true; fel.textContent = "";
  try{
    const d = await nyckelUrLosen(document.getElementById("pw").value.trim());
    if(document.getElementById("minns").checked){ try{ localStorage.setItem(MINNE, btoa(String.fromCharCode(...d))); }catch(_){} }
    await oppna(d);
  }catch(err){
    fel.textContent = (window.crypto && crypto.subtle) ? "Fel lösenord. Kontrollera stavningen och försök igen." : "Webbläsaren är för gammal för att öppna sidan. Uppdatera den och försök igen.";
    knapp.disabled = false;
  }
});
